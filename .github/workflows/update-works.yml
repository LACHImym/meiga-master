name: 出題データ自動更新（毎日）

on:
  schedule:
    - cron: "0 20 * * *"   # 毎日 05:00 JST（UTC 20:00）
  workflow_dispatch: {}     # 手動でも実行可（テスト用）

permissions:
  contents: write

concurrency:
  group: update-works
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: works.js を再生成（Notionから新作を取り込み）
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          RUN_DATE: ${{ github.run_started_at }}
        run: node scripts/generate-works.mjs

      - name: 変更があればコミット
        run: |
          if git diff --quiet -- works.js; then
            echo "新作なし。更新しません。"
          else
            git config user.name "meiga-bot"
            git config user.email "meiga-bot@users.noreply.github.com"
            git add works.js
            git commit -m "出題データ自動更新 ($(date -u +%Y-%m-%d))"
            git push
            echo "works.js を更新してpushしました。"
          fi
